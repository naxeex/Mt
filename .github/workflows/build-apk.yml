name: Build DroidForge APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate or unpack project and build APK
        run: |
          set -e
          # 1. If a .zip file was uploaded directly to the repo, unpack it automatically
          if [ -z "$(find . -maxdepth 3 -name 'settings.gradle.kts' -print -quit)" ]; then
            ZIP_FILE="$(find . -maxdepth 2 -name '*.zip' -print -quit)"
            if [ -n "$ZIP_FILE" ]; then
              echo "Unpacking uploaded archive: $ZIP_FILE"
              unzip -q -o "$ZIP_FILE"
            fi
          fi

          # 2. Find the directory containing settings.gradle.kts (root or DroidForge/ subfolder)
          SETTINGS_FILE="$(find . -maxdepth 3 -name 'settings.gradle.kts' -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Could not find settings.gradle.kts in the repository! Make sure DroidForge_Updated_Project.zip or the DroidForge folder is committed to this repo."
            ls -la
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "Found Android project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # 3. Accept Android SDK licenses so Gradle can install compileSdk 35 automatically
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

          # 4. Build the debug APK
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Compiled Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DroidForge-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
